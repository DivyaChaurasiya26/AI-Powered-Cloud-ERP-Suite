# Template only — copy to secret.yaml, fill in real values, and DO NOT commit
# secret.yaml (it's already covered by the repo .gitignore pattern for secret.yaml).
# Apply with: kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: erp-secrets
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://<user>:<password>@<cluster>/erp?retryWrites=true&w=majority"
  JWT_SECRET: "<generate with: openssl rand -hex 64>"
