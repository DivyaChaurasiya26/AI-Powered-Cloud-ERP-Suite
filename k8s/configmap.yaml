apiVersion: v1
kind: ConfigMap
metadata:
  name: erp-config
data:
  NODE_ENV: "production"
  API_PORT: "5000"
  ML_SERVICE_PORT: "8000"
  ML_SERVICE_URL: "http://ml-service:8000"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_URL: "redis://redis:6379"
  MODEL_STORE_PATH: "/app/models"
  ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8080"
