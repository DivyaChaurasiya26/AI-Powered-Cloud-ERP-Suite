# Local-images setup: build the three app images with the tags below and load
# them into your cluster (e.g. `kind load docker-image erp-api:local`) before
# applying — imagePullPolicy: IfNotPresent means it won't try to pull from a
# registry if the image already exists on the node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: erp-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-api
  template:
    metadata:
      labels:
        app: erp-api
    spec:
      containers:
        - name: api
          image: erp-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: API_PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: NODE_ENV
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: REDIS_PORT
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: ALLOWED_ORIGINS
            - name: ML_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: ML_SERVICE_URL
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: MONGO_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: erp-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  labels:
    app: erp-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-ml
  template:
    metadata:
      labels:
        app: erp-ml
    spec:
      containers:
        - name: ml-service
          image: erp-ml:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: ML_SERVICE_PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: REDIS_URL
            - name: MODEL_STORE_PATH
              valueFrom:
                configMapKeyRef:
                  name: erp-config
                  key: MODEL_STORE_PATH
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: erp-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: erp-web
  template:
    metadata:
      labels:
        app: erp-web
    spec:
      containers:
        - name: web
          image: erp-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: erp-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: erp-redis
  template:
    metadata:
      labels:
        app: erp-redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
