apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: erp-api
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: ml-service
spec:
  type: ClusterIP
  selector:
    app: erp-ml
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: erp-redis
  ports:
    - port: 6379
      targetPort: 6379
---
# NodePort (not an Ingress, per current scope) so the dashboard is reachable
# from outside the cluster without an ingress controller — e.g. on `kind`:
# http://localhost:30080 (with a matching extraPortMappings entry) or
# `kubectl port-forward svc/web 8080:8080`.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: erp-web
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
