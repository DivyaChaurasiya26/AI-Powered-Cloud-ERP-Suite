name: ERP CI Pipeline

on:
push:
branches:
- main
pull_request:
branches:
- main

jobs:
build:

```
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: pnpm/action-setup@v4
    with:
      version: 11.2.2

  - uses: actions/setup-node@v4
    with:
      node-version: 22

  - run: pnpm install

  - run: echo "Build validation completed"
```

docker:

```
runs-on: ubuntu-latest

needs: build

steps:
  - uses: actions/checkout@v4

  - name: Docker Validation
    run: docker --version
```
