name: ERP CI Pipeline

on:
  push:
    branches:
      - main
      - week4-devops
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r run lint
      - name: Build
        run: pnpm -r run build
      - name: Test API
        run: pnpm --filter api run test

  ml-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r apps/ml-service/requirements-dev.txt
      - name: Run tests
        run: pytest apps/ml-service

  docker:
    needs: [build-and-test, ml-service-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t erp-api:ci ./apps/api
      - name: Build ML service image
        run: docker build -t erp-ml:ci ./apps/ml-service
      - name: Build Web image
        run: docker build -t erp-web:ci ./apps/web
