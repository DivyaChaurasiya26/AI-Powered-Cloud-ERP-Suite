apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: erp-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: erp-api
  template:
    metadata:
      labels:
        app: erp-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef: { name: erp-config, key: API_PORT }
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef: { name: erp-config, key: NODE_ENV }
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef: { name: erp-config, key: REDIS_HOST }
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef: { name: erp-config, key: REDIS_PORT }
            - name: ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef: { name: erp-config, key: ALLOWED_ORIGINS }
            - name: ML_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: erp-config, key: ML_SERVICE_URL }
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: erp-secrets, key: MONGO_URI }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: erp-secrets, key: JWT_SECRET }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
