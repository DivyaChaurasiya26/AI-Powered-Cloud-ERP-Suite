# Render Blueprint — deploys the API, the web frontend, and Redis together.
#
# Usage: Render dashboard → New → Blueprint → point at this repo/branch →
# Render reads this file and proposes all three services below in one go.
#
# This was written against Render's documented Blueprint spec but has not
# been deployed against a live Render account from this session (that would
# need your account credentials) — treat field names as "should be correct,
# verify against Render's current docs if something doesn't parse," not as
# tested. See docs/deploy/render.md for the full walkthrough and the two
# manual steps Render can't fill in for you (MONGO_URI, and the web app's
# API URL).

services:
  # ── API ────────────────────────────────────────────────────────────────
  - type: web
    name: erp-api
    env: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Your MongoDB Atlas connection string. Atlas's Network Access list
      # needs to allow Render's egress IPs — on the free plan those aren't
      # static, so 0.0.0.0/0 is the practical option unless you're on a
      # paid Render plan with a static outbound IP.
      - key: MONGO_URI
        sync: false
      # Auto-generated by Render at deploy time — nothing to fill in.
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          name: erp-redis
          type: redis
          property: connectionString
      # The deployed web app's URL, e.g. https://erp-web-xxxx.onrender.com
      # — fill this in after the erp-web service below gets its URL
      # assigned (see docs/deploy/render.md, step 4).
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Redis (BullMQ queues, rate limiting, KPI cache) ──────────────────────
  # Render's free Redis tier has changed more than once — check current
  # pricing before relying on this being free. If it isn't, point REDIS_URL
  # above at a free external instance (e.g. Upstash) instead of this block.
  - type: redis
    name: erp-redis
    plan: starter
    ipAllowList: []

  # ── Web (static build, calls the API directly — no reverse proxy) ───────
  - type: web
    name: erp-web
    env: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      # The erp-api service's URL, e.g. https://erp-api-xxxx.onrender.com/api
      # — fill this in after the erp-api service above gets its URL
      # assigned (see docs/deploy/render.md, step 3). This is a *build-time*
      # var: changing it requires a rebuild, not just a restart.
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA fallback — client-side routes (e.g. /hr, /finance) all resolve
      # to index.html and React Router takes over from there.
      - type: rewrite
        source: /*
        destination: /index.html
